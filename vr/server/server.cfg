// OpenJK VR - dedicated server settings
//
// The server reads this file when it starts. Change a value, save, and
// restart the server - or type the same line into the server's window to
// change it while it runs (settings marked * change at the next map).
// Anything after // is a note. More in README-SERVER.txt.

// ---- Name and who can join ------------------------------------------
seta sv_hostname "OpenJK VR Server"   // its name in the server list
seta g_motd "VR sabers: swing for real" // shown to players as they join
seta sv_maxclients 8         // * players at once, bots included (up to 32)
seta g_password ""           // a password makes it private: players type
                             //   password <it>   in the console first
seta rconpassword ""         // run server commands from the game with it:
                             //   rconpassword <it>   then   rcon status
seta g_allowVote 1           // players can call votes (map, kick...)
seta g_inactivity 0          // kick players idle this many seconds (0 never)

// ---- Game ------------------------------------------------------------
// * game type: 0 Free For All, 3 Duel, 4 Power Duel, 6 Team FFA,
//              7 Siege, 8 Capture the Flag (the maps below must suit it)
seta g_gametype 0
seta fraglimit 20            // kills to win a map (Free For All, Team FFA)
seta duel_fraglimit 10       // duels to win a map (Duel)
seta capturelimit 8          // captures to win a map (Capture the Flag)
seta timelimit 15            // minutes a map lasts (0: until someone wins)
seta g_friendlyFire 0        // 1: you can hurt your own team
seta g_maxForceRank 7        // * highest Force rank to pick (7: Jedi Master)
seta g_weaponDisable 0       // * 0: guns as well, 524279: sabers only
seta g_duelWeaponDisable 524279  // * the same for Duel (sabers only)
seta g_dismember 0           // 100: limbs can come off

// ---- VR --------------------------------------------------------------
seta g_vrSaber 1             // VR players' real blades cut, block, clash
                             // (0: the old animated combat for everyone)
seta g_vrSaberDamageScale 1  // 1.5: blows half as hard again, 0.5: half
seta g_vrSaberSpeedScale 1   // higher: every blade needs faster swings
seta g_vrSaberUnlag 1        // blades judged as each player saw them
seta g_vrSaberBotGuard 1     // bots and players without VR raise their
                             // guard into a VR swing (0 off, 2 always)
seta g_vrSaberLog 1          // every swing, cut and clash into games.log
                             // (it grows: 0 for a busy public server)
seta sv_voiceChat 1          // proximity voice chat (players on this build)
seta sv_voiceRange 1600      // how far voices carry: 1600 is about 45 m
                             // (0: everyone hears everyone)
seta sv_clientRate 100000    // bytes a second each player may be sent - VR
                             // bodies and voices need more than the 50000
                             // the old game gets (it only sends what it has)

// ---- Bots ------------------------------------------------------------
seta bot_minplayers 2        // bots join until there are this many players
                             // and leave as people join (0: no bots)
seta g_npcspskill 3          // how good those bots are (1-5)
// More by hand in the server window:  addbot <name> <1-5>   kickbots

// ---- Maps ------------------------------------------------------------
// The server starts on the map below, then plays in turn every map that
// suits the game type - the game's own and custom ones alike. The first
// map has to suit the game type as well:
//   Free For All, Team FFA   mp/ffa1 - mp/ffa5
//   Duel, Power Duel         mp/duel1 and on
//   Capture the Flag         mp/ctf1 - mp/ctf5
//   Siege                    mp/siege_hoth, mp/siege_desert,
//                            mp/siege_korriban
// A custom map: its .pk3 in the game's base folder (players need it too).
seta g_autoMapCycle 1
map mp/ffa1

// Your own list of maps instead: g_autoMapCycle 0 above, and these lines
// in place of  map mp/ffa1  (without the //), as many as you like:
//   set m1 "map mp/ffa1 ; set nextmap vstr m2"
//   set m2 "map mp/ffa3 ; set nextmap vstr m3"
//   set m3 "map mp/ffa5 ; set nextmap vstr m1"
//   vstr m1
